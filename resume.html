<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hang 的个人简历。"><title>个人简历 · Hang</title>
<style>
:root{color-scheme:dark;--bg:#080a0c;--line:#29323a;--text:#f2f4f6;--muted:#9aa5af;--accent:#c8ff45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1080px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}nav{display:flex;justify-content:space-between;padding:28px 0}.mark{font-weight:800;letter-spacing:.12em}.back{color:var(--muted)}.back:hover{color:var(--accent)}header{border-bottom:1px solid var(--line)}.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:end;gap:70px;padding:94px 0 68px}.eyebrow,.label{color:var(--accent);font-size:.82rem;letter-spacing:.18em}.hero h1{margin:.45rem 0 1.4rem;font-size:clamp(4rem,10vw,8rem);line-height:.9;letter-spacing:-.065em}.summary{max-width:680px;margin:0;color:var(--muted);font-size:1.15rem;white-space:pre-line}.identity{padding:28px 0;border-top:1px solid #56616c;border-bottom:1px solid var(--line)}.identity strong{display:block;font-size:1.3rem}.identity span{color:var(--muted)}main{padding:76px 0 115px}.section{display:grid;grid-template-columns:210px 1fr;gap:64px;padding:58px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}.content{max-width:760px}.content h2{margin:0 0 22px;font-size:clamp(2rem,4vw,3.4rem);line-height:1.1;letter-spacing:-.04em}.plain-text{margin:0;color:var(--muted);font-size:1.06rem;white-space:pre-line}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.skill{padding:22px 18px;border-top:1px solid #52606c}.actions{display:flex;gap:14px;margin-top:34px}.action{padding:12px 18px;border:1px solid #53606b;background:transparent;color:var(--text);cursor:pointer;font:inherit}.primary{border-color:var(--accent);background:var(--accent);color:#090b0d;font-weight:700}.empty{display:none}footer{display:flex;justify-content:space-between;padding:32px 0;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:760px){.shell{width:calc(100% - 24px)}.hero,.section{grid-template-columns:1fr;gap:28px}.hero{padding:62px 0 50px}.hero h1{font-size:clamp(3.8rem,20vw,6rem)}main{padding:50px 0 76px}.section{padding:46px 0}.skills{grid-template-columns:1fr}footer{flex-direction:column;gap:8px}}@media print{body{background:#fff;color:#111}.back,.actions{display:none}.summary,.plain-text,.identity span,footer{color:#444}:root{--line:#ccc;--accent:#446600}.section{break-inside:avoid}}
</style><style>
.timeline{position:relative}.timeline::before{content:"";position:absolute;top:9px;bottom:12px;left:5px;width:1px;background:var(--line)}.entry{position:relative;padding:0 0 46px 34px}.entry:last-child{padding-bottom:0}.entry::before{content:"";position:absolute;top:9px;left:0;width:11px;height:11px;border:2px solid var(--accent);border-radius:50%;background:var(--bg)}.entry-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;margin-bottom:14px}.entry-title{margin:0;font-size:clamp(1.5rem,3vw,2.25rem);line-height:1.2;letter-spacing:-.025em}.entry-time{color:var(--muted);font-size:.9rem}.entry-role{margin:7px 0 0;color:var(--accent);font-weight:600}.entry-description{color:var(--muted);white-space:pre-line}.entry-description p{margin:0 0 9px}.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}.reveal.visible{opacity:1;transform:none}.entry.reveal{transition-delay:calc(var(--order,0)*90ms)}@media(max-width:760px){.entry-head{grid-template-columns:1fr}.entry-time{grid-row:1}.entry{padding-left:28px}}@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}@media print{.reveal{opacity:1;transform:none}.timeline::before{background:#bbb}}
</style><style>
.hero h1{font-size:clamp(3.2rem,7vw,5.4rem);line-height:.95}.identity{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}.profile-role{grid-column:1/-1}.contact-list{display:grid;gap:14px}.contact-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;font-size:1rem}.contact-row span{overflow-wrap:anywhere;color:var(--text)}.contact-row b{color:var(--muted);font-size:.76rem;letter-spacing:.08em}.qr-wrap{margin:0}.qr-wrap img,.qr-placeholder{display:grid;width:160px;height:160px;place-items:center;object-fit:cover;background:#fff}.qr-placeholder{border:1px dashed #59636d;background:#10151a;color:var(--muted);font-size:.68rem;text-align:center}.qr-wrap figcaption{color:var(--muted);font-size:.7rem;text-align:center}.skill{position:relative;padding:18px 18px 18px 52px;border-top:0;background:#10151a}.skill::before{content:"";position:absolute;left:19px;top:23px;width:14px;height:14px;border:2px solid var(--accent);border-radius:50%}.skill:nth-child(3n+2)::before{border-radius:2px;transform:rotate(45deg)}.skill:nth-child(3n)::before{width:16px;height:10px;border-radius:0;border-width:0 0 2px 2px;transform:rotate(-45deg)}#education-section .entry-title{font-size:clamp(2rem,4vw,3.4rem)}.utility{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}.utility-text strong{display:block}.utility-text span{color:var(--muted);font-size:.86rem}.utility .actions{margin:0}.utility .action{padding:9px 14px;font-size:.88rem}[hidden]{display:none!important}@media(max-width:760px){.identity{grid-template-columns:1fr auto}.utility{align-items:flex-start;flex-direction:column}}@media print{.utility{display:none}}
</style><style>
.hero{align-items:start}.hero-main{align-self:start;transform:none}.intro-card{max-width:680px;margin-top:26px;padding:0;border:0;background:none;text-align:left}.intro-label{display:block;margin-bottom:10px;color:var(--accent);font-size:.76rem;letter-spacing:.16em}.intro-card .summary{font-size:1.05rem;line-height:1.85;text-align:left}@media(max-width:760px){.intro-card{margin-top:22px}}
</style><style>#education-section .entry-title{font-size:clamp(1.5rem,3vw,2.25rem)}</style></head><body>
<header><nav class="shell"><a class="mark" href="index.html">HANG / 简历</a><a class="back" href="index.html">← 返回作品集</a></nav><div class="hero shell"><div class="hero-main"><div class="eyebrow">个人简历</div><h1 id="name">Hang</h1><div class="intro-card"><span class="intro-label">个人介绍</span><p class="summary" id="summary"></p></div></div><div class="identity"><div class="profile-role"><strong id="role">数字艺术创作者</strong><span id="role-subtitle" hidden></span></div><div class="contact-list"><div class="contact-row" id="phone-row"><b>电话</b><span id="phone">15013064479</span></div><div class="contact-row" id="email-row"><b>邮箱</b><span id="email">hang12048468@qq.com</span></div><div class="contact-row" id="birthday-row"><b>生日</b><span id="birthday">—</span></div></div><figure class="qr-wrap" id="qr-wrap"><img id="wechat-qr" src="简历内容/wechat-qr.png" alt="微信二维码"><figcaption>微信</figcaption></figure></div></div></header>
<main class="shell">
<section class="section" id="skills-section"><div class="label">专业技能</div><div class="content skills" id="skills"></div></section>
<section class="section empty" id="work-section"><div class="label">工作经历</div><div class="content"><h2>工作经历</h2><div class="timeline" id="work"></div></div></section>
<section class="section empty" id="education-section"><div class="label">毕业院校</div><div class="content"><div class="timeline" id="education"></div></div></section>
<div class="utility"><div class="utility-text"><strong>简历操作</strong><span>浏览在线作品，或保存当前简历。</span></div><div class="actions"><a class="action primary" href="index.html#works">查看作品</a><button class="action" type="button" onclick="window.print()">保存 PDF</button></div></div>
</main><footer class="shell"><span>© <span id="year"></span> Hang</span><a href="index.html">返回作品集</a></footer>
<script>
const base='简历内容/';
async function textFile(name){try{const response=await fetch(base+name+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)return '';const text=await response.text();return text.split('\n').filter(line=>!line.trim().startsWith('#')).join('\n').trim()}catch{return ''}}
function renderEntries(targetId,text){const blocks=text.split(/\n\s*\n/).map(block=>block.trim()).filter(Boolean),root=document.querySelector('#'+targetId);blocks.forEach((block,index)=>{const lines=block.split('\n').map(line=>line.trim()).filter(Boolean),title=lines.shift()||'',roleLine=lines.find(line=>line.startsWith('职位：')),timeLine=lines.find(line=>line.startsWith('时间：')),details=lines.filter(line=>line!==roleLine&&line!==timeLine);const article=document.createElement('article');article.className='entry reveal';article.style.setProperty('--order',index);article.innerHTML='<div class="entry-head"><div><h3 class="entry-title"></h3><p class="entry-role"></p></div><span class="entry-time"></span></div><div class="entry-description"></div>';article.querySelector('.entry-title').textContent=title;const role=article.querySelector('.entry-role'),time=article.querySelector('.entry-time');if(roleLine)role.textContent=roleLine.replace(/^职位：/,'');else role.remove();if(timeLine)time.textContent=timeLine.replace(/^时间：/,'');else time.remove();const description=article.querySelector('.entry-description');details.forEach(line=>{const paragraph=document.createElement('p');paragraph.textContent=line;description.appendChild(paragraph)});root.appendChild(article)});if(blocks.length)document.querySelector('#'+targetId+'-section').classList.remove('empty')}
function startReveal(){const items=document.querySelectorAll('.section:not(.empty),.entry');items.forEach(item=>item.classList.add('reveal'));if(!('IntersectionObserver'in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){items.forEach(item=>item.classList.add('visible'));return}const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target)}}),{threshold:.12});items.forEach(item=>observer.observe(item))}
async function loadResume(){const [name,role,roleSubtitle,summary,skills,work,education,phone,email,birthday]=await Promise.all(['name.txt','role.txt','role-subtitle.txt','summary.txt','skills.txt','work.txt','education.txt','phone.txt','email.txt','birthday.txt'].map(textFile));if(name){document.querySelector('#name').textContent=name;document.title=`个人简历 · ${name}`}if(role)document.querySelector('#role').textContent=role;if(roleSubtitle){const subtitle=document.querySelector('#role-subtitle');subtitle.textContent=roleSubtitle;subtitle.hidden=false}if(summary)document.querySelector('#summary').textContent=summary;if(phone){document.querySelector('#phone').textContent=phone;document.querySelector('#phone-row').hidden=false}if(email){document.querySelector('#email').textContent=email;document.querySelector('#email-row').hidden=false}if(birthday)document.querySelector('#birthday').textContent=birthday;const skillList=skills.split('\n').map(item=>item.trim()).filter(Boolean);document.querySelector('#skills').innerHTML=skillList.map(item=>`<div class="skill"></div>`).join('');document.querySelectorAll('.skill').forEach((item,index)=>item.textContent=skillList[index]);if(!skillList.length)document.querySelector('#skills-section').classList.add('empty');if(work)renderEntries('work',work);if(education)renderEntries('education',education);startReveal()}
document.querySelector('#year').textContent=new Date().getFullYear();document.querySelector('#wechat-qr').src=base+'wechat-qr.png?v='+Date.now();loadResume();
</script></body></html>
