<!-- 首页轮播维护：图片放入 Homepage image，按 001.jpg、002.jpg、003.jpg 连续编号，页面会自动读取并循环。 -->

<main class="shell" id="works"><div class="section-head"><h2>3D作品集</h2><span class="count" id="mview-count">正在载入…</span></div>
<!-- 交互作品维护：在 Mview 中添加连续编号的 Work04、Work05……；每个文件夹放 model.mview、cover.jpg、title.txt、subtitle.txt。 -->

<!-- ==================== 个人介绍模块：可在这里修改介绍文字 ==================== -->
<section class="about" id="about"><div class="about-label">关于我</div><div class="about-copy"><h2 id="about-title">专注角色、场景<br>与视觉表达。</h2><p id="about-description">这里收录我的数字艺术创作，包括角色设计、场景作品与视觉探索。我关注形体、材质和光影，也希望通过实时展示，让作品的细节得到更完整的呈现。</p><div class="profile-card" id="about-profile"><div class="profile-id"><div class="profile-monogram" id="about-avatar"><span>H</span></div><div><strong id="about-name">Hang</strong><span id="about-role">数字艺术创作者</span></div></div><div class="profile-focus" id="about-focus">角色设计 · 场景创作<br>材质与灯光表现</div></div><div class="disciplines" id="about-directions"><div class="discipline"><strong>角色创作</strong>角色设计与数字雕刻</div><div class="discipline"><strong>场景创作</strong>环境设计与空间氛围</div><div class="discipline"><strong>实时呈现</strong>材质、灯光与交互展示</div></div></div></section>
</main><footer class="shell"><span>© <span id="year"></span> Hang</span><span>3D Art Portfolio</span></footer><button class="to-top" id="to-top" type="button" aria-label="回到页面顶部"><span class="to-top-icon">↑</span><span class="to-top-text">回到顶部</span></button>
<dialog class="image-dialog" id="image-viewer"><button class="image-close" aria-label="关闭大图">×</button><img alt="作品大图"></dialog><dialog id="viewer"><div class="viewer-bar"><strong id="viewer-title"></strong><button class="close" aria-label="关闭 3D 查看器">×</button></div><iframe title="3D 作品查看器" allow="fullscreen"></iframe></dialog>
<script>
const dialog=document.querySelector('#viewer'),frame=dialog.querySelector('iframe'),title=document.querySelector('#viewer-title'),imageDialog=document.querySelector('#image-viewer'),fullImage=imageDialog.querySelector('img');
document.addEventListener('click',event=>{const card=event.target.closest('[data-viewer]');if(card){title.textContent=card.dataset.title;frame.src=card.dataset.viewer;dialog.showModal()}});
function closeViewer(){dialog.close();frame.src='about:blank'}dialog.querySelector('.close').addEventListener('click',closeViewer);dialog.addEventListener('click',event=>{if(event.target===dialog)closeViewer()});
document.addEventListener('click',event=>{const button=event.target.closest('[data-full-image]');if(button){fullImage.src=button.dataset.fullImage;imageDialog.showModal()}});imageDialog.querySelector('.image-close').addEventListener('click',()=>imageDialog.close());imageDialog.addEventListener('click',event=>{if(event.target===imageDialog)imageDialog.close()});document.querySelector('#year').textContent=new Date().getFullYear();

const pad=number=>String(number).padStart(3,'0');
const escapeHTML=value=>value.replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));
async function exists(path){try{return(await fetch(path,{method:'HEAD'})).ok}catch{return false}}
async function numberedImages(folder){const paths=[];for(let number=1;number<=99;number++){const path=`${folder}/${pad(number)}.jpg`;if(!await exists(path))break;paths.push(path)}return paths}
async function readText(path,fallback){try{const response=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(response.ok){const value=(await response.text()).trim();if(value)return value}}catch{}return fallback}

async function loadMviews(){const grid=document.querySelector('#mview-grid'),counter=document.querySelector('#mview-count'),works=[];for(let number=1;number<=50;number++){const label=String(number).padStart(2,'0'),folder=`Mview/Work${label}`;if(!await exists(folder+'/model.mview'))break;const [title,subtitle]=await Promise.all([readText(folder+'/title.txt',`作品 ${label}`),readText(folder+'/subtitle.txt','3D 作品')]);works.push({label,folder,title,subtitle})}grid.innerHTML=works.length?works.map(work=>`<button class="work" style="--cover:url('${work.folder}/cover.jpg')" data-viewer="mview-viewer.html?work=${work.label}" data-title="${escapeHTML(work.title)}"><span class="visual"></span><span class="number">${work.label}</span><span class="meta"><span><h3>${escapeHTML(work.title)}</h3><p>${escapeHTML(work.subtitle)}</p></span><span class="open" aria-hidden="true"></span></span></button>`).join(''):'<p class="count">暂无交互作品</p>';counter.textContent=`${String(works.length).padStart(2,'0')} / 作品`}

async function loadHomepage(){const paths=await numberedImages('Homepage image'),root=document.querySelector('#home-carousel'),count=document.querySelector('#home-count'),headlines=['<strong>观察</strong><span>从细节中寻找形体与灵感</span>','<strong>塑造</strong><span>让想象拥有清晰而具体的轮廓</span>','<strong>呈现</strong><span>在材质与光影之间完成表达</span>'];if(!paths.length)return;root.innerHTML=paths.map((path,index)=>`<div class="slide${index===0?' active':''}" style="background-image:url('${path}')"><div class="slide-content"><div class="slide-copy"><span class="slide-tag">作品展示 · ${pad(index+1)}</span><h1>${headlines[index%headlines.length]}</h1><p>数字创作的精选展示</p></div></div></div>`).join('')+`<div class="carousel-dots">${paths.map((_,index)=>`<button class="carousel-dot${index===0?' active':''}" aria-label="显示第 ${index+1} 页"></button>`).join('')}</div>`;count.textContent=`01 — ${pad(paths.length)}`.replace('00','0');const slides=[...root.querySelectorAll('.slide')],dots=[...root.querySelectorAll('.carousel-dot')];let active=0;const show=index=>{active=(index+slides.length)%slides.length;slides.forEach((slide,i)=>slide.classList.toggle('active',i===active));dots.forEach((dot,i)=>dot.classList.toggle('active',i===active));count.textContent=`${String(active+1).padStart(2,'0')} — ${String(slides.length).padStart(2,'0')}`};dots.forEach((dot,index)=>dot.addEventListener('click',()=>show(index)));if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>show(active+1),4200)}

async function readWorkTitle(folder,number){try{const response=await fetch(`${folder}/title.txt`);if(response.ok){const value=(await response.text()).trim();if(value)return value}}catch{}return `作品 ${String(number).padStart(2,'0')}`}
function createGroup(folderNumber,title,paths){const label=String(folderNumber).padStart(2,'0');return `<article class="portfolio-group"><div class="portfolio-title"><h3>${title}</h3><span>${paths.length} 张</span></div><div class="still-carousel"><div class="still-track">${paths.map((path,index)=>`<figure class="still still-slide"><button class="still-media" data-full-image="${path}" aria-label="查看${title}第 ${index+1} 张大图"><img src="${path}" alt="${title}第 ${index+1} 张" loading="lazy"></button></figure>`).join('')}</div><div class="still-controls"><div class="still-arrows"><button class="still-arrow still-prev" aria-label="上一张">←</button><button class="still-arrow still-next" aria-label="下一张">→</button></div><div class="still-dots">${paths.map((_,index)=>`<button class="still-dot${index===0?' active':''}" aria-label="显示第 ${index+1} 张"></button>`).join('')}</div><span class="still-page">01 / ${String(paths.length).padStart(2,'0')}</span></div></div></article>`}
function activateGroup(group){
  const track=group.querySelector('.still-track'),slides=[...group.querySelectorAll('.still-slide')],dots=[...group.querySelectorAll('.still-dot')],page=group.querySelector('.still-page');
  if(slides.length>1){const firstClone=slides[0].cloneNode(true);firstClone.setAttribute('aria-hidden','true');track.appendChild(firstClone)}
  let active=0,position=0,timer;
  const updateInfo=index=>{active=(index+slides.length)%slides.length;dots.forEach((dot,i)=>dot.classList.toggle('active',i===active));page.textContent=`${String(active+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`};
  const moveTo=(index,animate=true)=>{position=index;track.style.transition=animate?'transform .7s cubic-bezier(.22,.61,.36,1)':'none';track.style.transform=`translateX(-${position*100}%)`;updateInfo(index)};
  const moveNext=()=>{if(slides.length<2||position>=slides.length)return;moveTo(position+1)};
  track.addEventListener('transitionend',()=>{if(position===slides.length){moveTo(0,false);requestAnimationFrame(()=>requestAnimationFrame(()=>track.style.transition='transform .7s cubic-bezier(.22,.61,.36,1)'))}});
  const restart=()=>{clearInterval(timer);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(moveNext,5000)};
  group.querySelector('.still-prev').addEventListener('click',()=>{moveTo((active-1+slides.length)%slides.length);restart()});group.querySelector('.still-next').addEventListener('click',()=>{moveNext();restart()});dots.forEach((dot,index)=>dot.addEventListener('click',()=>{moveTo(index);restart()}));restart()
}
async function loadPortfolio(){const root=document.querySelector('#portfolio-groups'),groups=[];for(let number=1;number<=50;number++){const folder=`Work Portfolio/Work${String(number).padStart(2,'0')}`,paths=await numberedImages(folder);if(!paths.length)break;const title=await readWorkTitle(folder,number);groups.push({number,title,paths})}root.innerHTML=groups.length?groups.map(group=>createGroup(group.number,group.title,group.paths)).join(''):'<p class="count">暂无作品</p>';root.querySelectorAll('.portfolio-group').forEach(activateGroup)}
async function aboutText(name){try{const response=await fetch('首页介绍/'+name+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)return '';return(await response.text()).split('\n').filter(line=>!line.trim().startsWith('#')).join('\n').trim()}catch{return ''}}
async function loadAbout(){const [title,description,name,role,focus,directions]=await Promise.all(['title.txt','description.txt','name.txt','role.txt','focus.txt','directions.txt'].map(aboutText));const values=[['about-title',title],['about-description',description],['about-name',name],['about-role',role],['about-focus',focus]];values.forEach(([id,value])=>{const element=document.querySelector('#'+id);element.hidden=!value;if(value)element.textContent=value});const list=directions.split('\n').map(line=>line.split('|').map(part=>part.trim())).filter(parts=>parts[0]),root=document.querySelector('#about-directions');root.hidden=!list.length;if(list.length){root.innerHTML='';list.forEach(([heading,detail=''])=>{const item=document.createElement('div'),strong=document.createElement('strong');item.className='discipline';strong.textContent=heading;item.append(strong,document.createTextNode(detail));root.appendChild(item)})}let hasAvatar=false;try{const avatar=await fetch('首页介绍/avatar.png?v='+Date.now(),{method:'HEAD',cache:'no-store'});if(avatar.ok){hasAvatar=true;const avatarRoot=document.querySelector('#about-avatar'),image=document.createElement('img');image.src='首页介绍/avatar.png?v='+Date.now();image.alt=name||'个人头像';avatarRoot.replaceChildren(image)}}catch{}document.querySelector('#about-avatar').hidden=!hasAvatar&&!name;document.querySelector('#about-profile').hidden=!name&&!role&&!focus&&!hasAvatar}
const toTop=document.querySelector('#to-top');addEventListener('scroll',()=>toTop.classList.toggle('visible',scrollY>600),{passive:true});toTop.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
loadHomepage();loadMviews();loadPortfolio();loadAbout();
</script>
